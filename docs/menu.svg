<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1D1D1F">
  <title id="t">The Moor menu</title>
  <desc id="d">Illustration of the Moor menu bar menu, with the Lock to Display submenu listing the connected displays.</desc>
  <rect width="640" height="290" rx="18" fill="#DCE3EA"/>
  <rect width="640" height="34" fill="#F4F6F8" opacity="0.9"/>
  <rect x="244" y="4" width="32" height="26" rx="6" fill="#C9D1D9"/>
  <rect x="251" y="10" width="18" height="14" rx="2.5" fill="none" stroke="#1D1D1F" stroke-width="1.6"/>
  <rect x="254.5" y="19" width="11" height="2.4" rx="1.2" fill="#1D1D1F"/>

  <rect x="40" y="40" width="270" height="228" rx="10" fill="#F7F8FA" stroke="#B8C0C8"/>
  <text x="62" y="68" fill="#8A9099">Dock locked to External Monitor</text>
  <line x1="50" x2="300" y1="82" y2="82" stroke="#D5DAE0"/>
  <text x="46" y="108">✓</text><text x="62" y="108">Lock Dock</text>
  <rect x="48" y="118" width="254" height="28" rx="6" fill="#1E6FD9"/>
  <text x="62" y="137" fill="#fff">Lock to Display</text><text x="288" y="137" fill="#fff">›</text>
  <text x="62" y="170">Move Dock Now</text>
  <line x1="50" x2="300" y1="184" y2="184" stroke="#D5DAE0"/>
  <text x="62" y="210">Open at Login</text>
  <line x1="50" x2="300" y1="224" y2="224" stroke="#D5DAE0"/>
  <text x="62" y="250">Quit Moor</text>

  <rect x="316" y="114" width="250" height="84" rx="10" fill="#F7F8FA" stroke="#B8C0C8"/>
  <rect x="324" y="122" width="234" height="30" rx="6" fill="#E3E9F0"/>
  <text x="332" y="142">✓</text><text x="350" y="142">External Monitor</text>
  <text x="350" y="178">Built-in Retina Display</text>
